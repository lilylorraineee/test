
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Login - TVET Parking System</title>
   <script src="https://saver-systm.lilylorraineee.workers.dev/js/lecturer_login.js"></script>
</head>
<link rel="stylesheet" href="https://saver-systm.lilylorraineee.workers.dev/Design/lecturer_login.css">

<body>

<div class="topbar">
    <div class="brand">TVETMARA LUMUT</div>
    <div class="menu-icon" onclick="toggleMenu()">☰</div>
</div>

<div id="overlay" onclick="toggleMenu()"></div>

<div id="menu" class="menu">
    <a href="https://saver-systm.lilylorraineee.workers.dev/index.html">🏠 Home</a>
    <a href="https://saver-systm.lilylorraineee.workers.dev/student/student_login.html">🎓 Student Login</a>
    <a href="https://saver-systm.lilylorraineee.workers.dev/student/student_signup.html">📝 Student Sign Up</a>
    <a href="https://saver-systm.lilylorraineee.workers.dev/lecturer/lecturer_login.html">👨‍🏫 Lecturer Login</a>
    <a href="https://saver-systm.lilylorraineee.workers.dev/lecturer/lecturer_signup.html">📝 Lecturer Sign Up</a>
    <a href="https://saver-systm.lilylorraineee.workers.dev/login.html">👮 Warden Login</a>
</div>

<div class="dashboard-container">
    <div class="login-box glass">
        <h2 class="main-title">👨‍🏫 Lecturer Login</h2>

        <div id="successMsg" class="success-msg"></div>
        <div id="errorMsg" class="error-msg"></div>

        <form id="loginForm" onsubmit="return loginLecturer()">
            <div class="input-group">
                <label>📧 Email Address</label>
                <input type="email" id="email" placeholder="lecturer@tvetmara.edu.my" required>
            </div>

            <div class="input-group">
                <label>🔒 Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-start">Login →</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="https://saver-systm.lilylorraineee.workers.dev/lecturer/lecturer_signup.html">Sign Up here</a>
        </div>

        <a href="https://saver-systm.lilylorraineee.workers.dev/index.html" class="back-link">← Back to Home</a>
    </div>
</div>



</body>
</html>
