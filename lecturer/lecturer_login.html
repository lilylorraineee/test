
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Login - TVET Parking System</title>
   
</head>
<link rel="stylesheet" href="C:\xampp\htdocs\parking_system\Design\lecturer_login.css">

<body>

<div class="topbar">
    <div class="brand">TVETMARA LUMUT</div>
    <div class="menu-icon" onclick="toggleMenu()">☰</div>
</div>

<div id="overlay" onclick="toggleMenu()"></div>

<div id="menu" class="menu">
    <a href="C:\xampp\htdocs\parking_system\index.html">🏠 Home</a>
    <a href="C:\xampp\htdocs\parking_system\student\student_login.html">🎓 Student Login</a>
    <a href="C:\xampp\htdocs\parking_system\student\student_signup.html">📝 Student Sign Up</a>
    <a href="C:\xampp\htdocs\parking_system\lecturer\lecturer_login.html">👨‍🏫 Lecturer Login</a>
    <a href="C:\xampp\htdocs\parking_system\lecturer\lecturer_signup.html">📝 Lecturer Sign Up</a>
    <a href="C:\xampp\htdocs\parking_system\login.html">👮 Warden Login</a>
</div>

<div class="dashboard-container">
    <div class="login-box glass">
        <h2 class="main-title">👨‍🏫 Lecturer Login</h2>

        <div id="successMsg" class="success-msg"></div>
        <div id="errorMsg" class="error-msg"></div>

        <form id="loginForm" onsubmit="return loginLecturer()">
            <div class="input-group">
                <label>📧 Email Address</label>
                <input type="email" id="email" placeholder="lecturer@tvetmara.edu.my" required>
            </div>

            <div class="input-group">
                <label>🔒 Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-start">Login →</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="C:\xampp\htdocs\parking_system\lecturer\lecturer_signup.html">Sign Up here</a>
        </div>

        <a href="index.php" class="back-link">← Back to Home</a>
    </div>
</div>

<script>
function toggleMenu(){
    var menu = document.getElementById("menu");
    var overlay = document.getElementById("overlay");
    menu.classList.toggle("active");
    overlay.classList.toggle("active");
}

// Check for success message from signup
const urlParams = new URLSearchParams(window.location.search);
const success = urlParams.get('success');
if(success) {
    document.getElementById('successMsg').style.display = 'block';
    document.getElementById('successMsg').innerHTML = '✅ ' + success;
}

function loginLecturer() {
    let email = document.getElementById('email').value;
    let password = document.getElementById('password').value;
    let errorMsg = document.getElementById('errorMsg');
    let successMsg = document.getElementById('successMsg');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    let lecturers = JSON.parse(localStorage.getItem('lecturers')) || [];
    let lecturer = lecturers.find(l => l.email === email && l.password === password);

    if(lecturer) {
        let lecturerData = {
            id: lecturer.id,
            name: lecturer.name,
            email: lecturer.email,
            staff_id: lecturer.staff_id,
            ic_no: lecturer.ic_no,
            phone_no: lecturer.phone_no,
            department: lecturer.department,
            position: lecturer.position,
            plate_no: lecturer.plate_no || ''
        };
        
        sessionStorage.setItem('loggedInLecturer', JSON.stringify(lecturerData));
        window.location.href = 'C:\xampp\htdocs\parking_system\lecturer\lecturer_dashboard.html';
    } else {
        errorMsg.style.display = 'block';
        errorMsg.innerHTML = '❌ Invalid email or password';
    }
    return false;
}
</script>

</body>
</html>
