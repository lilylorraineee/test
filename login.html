<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TVET Parking</title>
    <link rel="stylesheet" href="https://saver-systm.lilylorraineee.workers.dev/Design/login.css">
</head>
<body>

<!-- ===== TOP BAR ===== -->
<div class="topbar">
    <div class="brand">TVETMARA LUMUT</div>
    <div class="menu-icon" onclick="toggleMenu()">☰</div>
</div>

<!-- ===== OVERLAY (for menu) ===== -->
<div id="overlay" onclick="toggleMenu()"></div>

<!-- ===== SIDE MENU ===== -->
<div id="menu" class="menu">
    <a href="https://saver-systm.lilylorraineee.workers.dev/index.html">🏠 Home</a>
    <a href="https://saver-systm.lilylorraineee.workers.dev/login.html">🔐 Login</a>
    <a href="https://saver-systm.lilylorraineee.workers.dev/student/student_signup.html" onclick="sessionStorage.clear();">📝 Student Sign Up</a>
    <a href="https://saver-systm.lilylorraineee.workers.dev/lecturer/lecturer_signup.html" onclick="sessionStorage.clear();">📝 Lecturer Sign Up</a>
    <a href="#">ℹ️ About</a>
</div>

<!-- ===== LOGIN FORM ===== -->
<div class="login-container">
    <div class="login-box glass">
        <h2 class="main-title" id="pageTitle">🔐 Student Login</h2>

        <div id="errorMsg" class="error-msg"></div>

        <!-- Role Selection Buttons -->
        <div class="role-selection">
            <button type="button" id="studentRoleBtn" class="role-btn student active" onclick="selectRole('student')">🎓 Student</button>
            <button type="button" id="lecturerRoleBtn" class="role-btn lecturer" onclick="selectRole('lecturer')">👨‍🏫 Lecturer</button>
            <button type="button" id="adminRoleBtn" class="role-btn admin" onclick="selectRole('admin')">👑 Admin</button>
        </div>

        <form id="loginForm" onsubmit="return handleLogin()">
            <div class="input-group">
                <label id="emailLabel">📧 Email Address</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>

            <div class="input-group">
                <label>🔒 Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">🎓 Login →</button>
        </form>

        <!-- Signup Links (Ditambah z-index & clear session supaya boleh tekan & tak auto redirect) -->
        <div id="studentSignupLink" class="signup-link" style="position: relative; z-index: 999;">
            Don't have an account? <a href="https://saver-systm.lilylorraineee.workers.dev/student/student_signup.html" onclick="sessionStorage.clear();">Sign Up here</a>
        </div>
        <div id="lecturerSignupLink" class="signup-link" style="display: none; position: relative; z-index: 999;">
            Don't have an account? <a href="https://saver-systm.lilylorraineee.workers.dev/lecturer/lecturer_signup.html" onclick="sessionStorage.clear();">Sign Up here</a>
        </div>
        <div id="adminSignupLink" class="signup-link" style="display: none; color: #999; position: relative; z-index: 999;">
            🔒 Admin access is restricted
        </div>

        <a href="https://saver-systm.lilylorraineee.workers.dev/index.html" class="back-link">← Back to Home</a>
    </div>
</div>


</body>
</html>
