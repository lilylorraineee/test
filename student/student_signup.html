<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Sign Up - TVET Parking System</title>
    <link rel="stylesheet" href="https://saver-systm.lilylorraineee.workers.dev/Design/student_signup.css">
</head>
<body>

<div class="topbar">
    <div class="brand">TVETMARA LUMUT</div>
    <div class="menu-icon" onclick="toggleMenu()">☰</div>
</div>

<div id="overlay" onclick="toggleMenu()"></div>

<div id="menu" class="menu">
    <a href="https://saver-systm.lilylorraineee.workers.dev/index.html">🏠 Home</a>
    <a href="https://saver-systm.lilylorraineee.workers.dev/student/student_login.html">🎓 Student Login</a>
    <a href="https://saver-systm.lilylorraineee.workers.dev/login.html" class="warden-link">👮 Warden / Staff Login</a>
    <a href="#">ℹ️ About</a>
</div>

<div class="dashboard-container" style="position: relative; z-index: 10;">
    <div class="signup-box glass">
        <h2 class="main-title">📝 Student Registration</h2>

        <div id="errorMsg" class="error-msg" style="display: none; color: #ff4d4d; background: rgba(255, 0, 0, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; text-align: center;"></div>

        <form id="signupForm" onsubmit="event.preventDefault(); registerStudent();">
            <div class="form-grid">
                <div class="input-group full-width">
                    <label>👤 Full Name</label>
                    <input type="text" id="fullname" placeholder="Enter Your Full Name">
                </div>

                <div class="input-group">
                    <label>🆔 IC Number</label>
                    <input type="text" id="ic_no" placeholder="Enter Your IC Number">
                </div>

                <div class="input-group">
                    <label>🎓 Matric Number</label>
                    <input type="text" id="matric_no" placeholder="Enter Your Matric Number">
                </div>

                <div class="input-group">
                    <label>📚 Semester</label>

                    <select id="semester">
                        <option value="">Select Semester</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>📖 Program</label>
                    <select id="program">
                        <option value="">Select Program</option>
                        <option value="ITW">ITW</option>
                        <option value="DFD">DFD</option>
                        <option value="DNS">DNS</option>
                        <option value="DTB">DTB</option>
                        <option value="DCP">DCP</option>
                        <option value="DCS">DCS</option>
                        <option value="DGA">DGA</option>
                        <option value="DCB">DCB</option>
                        <option value="DTF">DTF</option>
                        <option value="DTW">DTW</option>
                        <option value="SBN">SBN</option>
                        <option value="SLR">SLR</option>
                        <option value="SSB">SSB</option>
                        <option value="STF">STF</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>📱 Phone Number</label>
                    <input type="text" id="phone_no" placeholder="Enter Your Phone Number">
                </div>

                <div class="input-group">
                    <label>📧 Email</label>
                    <input type="email" id="email" placeholder="name@gmail.com">
                </div>

                <div class="input-group">
                    <label>🔒 Password</label>
                    <input type="password" id="password" placeholder="Create a password (min 6 chars)">
                </div>

                <div class="input-group">
                    <label>🔒 Confirm Password</label>
                    <input type="password" id="confirm_password" placeholder="Confirm your password">
                </div>
            </div>

            <button type="button" onclick="registerStudent()" class="btn-start" style="position: relative; z-index: 100; cursor: pointer; margin-top: 15px;">Register →</button>
        </form>

        <div class="login-link" style="position: relative; z-index: 100; margin-top: 15px;">
            Already have an account? <a href="https://saver-systm.lilylorraineee.workers.dev/student/student_login.html">Login here</a>
        </div>

        <a href="https://saver-systm.lilylorraineee.workers.dev/index.html" class="back-link" style="position: relative; z-index: 100;">← Back to Home</a>
    </div>
</div>

<script>
// ============================================================
// TOGGLE MENU
// ============================================================
function toggleMenu(){
    var menu = document.getElementById("menu");
    var overlay = document.getElementById("overlay");
    if (menu) menu.classList.toggle("active");
    if (overlay) overlay.classList.toggle("active");
}

// ============================================================
// REGISTER STUDENT
// ============================================================
function registerStudent() {
    // Clear sebarang sesi aktif sebelum mendaftar akaun baru
    sessionStorage.clear();

    // Get form values
    var fullname = document.getElementById('fullname').value.trim();
    var ic_no = document.getElementById('ic_no').value.trim();
    var matric_no = document.getElementById('matric_no').value.trim();
    var semester = document.getElementById('semester').value;
    var program = document.getElementById('program').value;
    var phone_no = document.getElementById('phone_no').value.trim();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var confirm_password = document.getElementById('confirm_password').value;
    var errorMsg = document.getElementById('errorMsg');

    // Clear previous error
    if (errorMsg) {
        errorMsg.style.display = 'none';
        errorMsg.innerHTML = '';
    }

    // Validation - Check all fields
    if (!fullname || !ic_no || !matric_no || !semester || !program || !phone_no || !email || !password || !confirm_password) {
        if (errorMsg) {
            errorMsg.style.display = 'block';
            errorMsg.innerHTML = '❌ Please fill in all fields.';
        }
        return false;
    }

    // Validation - Password match
    if(password !== confirm_password) {
        if (errorMsg) {
            errorMsg.style.display = 'block';
            errorMsg.innerHTML = '❌ Passwords do not match';
        }
        return false;
    }

    // Validation - Password length
    if(password.length < 6) {
        if (errorMsg) {
            errorMsg.style.display = 'block';
            errorMsg.innerHTML = '❌ Password must be at least 6 characters';
        }
        return false;
    }

    // Get existing students
    var students = JSON.parse(localStorage.getItem('students')) || [];

    // Check if email already exists
    for (var i = 0; i < students.length; i++) {
        if (students[i].email === email) {
            if (errorMsg) {
                errorMsg.style.display = 'block';
                errorMsg.innerHTML = '❌ Email already registered. Please login.';
            }
            return false;
        }
    }

    // Check if matric number already exists
    for (var j = 0; j < students.length; j++) {
        if (students[j].matric_no === matric_no) {
            if (errorMsg) {
                errorMsg.style.display = 'block';
                errorMsg.innerHTML = '❌ Matric number already registered';
            }
            return false;
        }
    }

    // Create new student object
    var newStudent = {
        id: Date.now(),
        name: fullname,
        ic_no: ic_no,
        matric_no: matric_no,
        semester: semester,
        program: program,
        phone_no: phone_no,
        email: email,
        password: password,
        plate_no: '',
        vehicle_type: '',
        vehicle_color: ''
    };

    // Save to localStorage
    students.push(newStudent);
    localStorage.setItem('students', JSON.stringify(students));

    // Save to sessionStorage for auto login
    var loggedInStudent = {
        id: newStudent.id,
        name: newStudent.name,
        email: newStudent.email,
        matric_no: newStudent.matric_no,
        ic_no: newStudent.ic_no,
        phone_no: newStudent.phone_no,
        plate_no: newStudent.plate_no,
        vehicle_type: newStudent.vehicle_type,
        vehicle_color: newStudent.vehicle_color,
        semester: newStudent.semester,
        program: newStudent.program
    };
    sessionStorage.setItem('loggedInStudent', JSON.stringify(loggedInStudent));

    // Redirect to student dashboard
    window.location.href = 'https://saver-systm.lilylorraineee.workers.dev/student/student_dashboard.html';
    
    return false;
}
</script>

</body>
</html>
